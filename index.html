<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0A3976"><link rel="icon" type="image/png" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BTA Ops"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BTA Ops Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ops board. Aircraft status strip up top, tabbed workspace, an 8-week crew timeline as the centerpiece. */
:root{
  --brand:#0A3976; --brand-ink:#FFFFFF; --brand-2:#082E60;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8EDF4; --line:#D3DAE4; --ink:#0F1F33; --muted:#566377;
  --accent:#0A3976; --accent-ink:#FFFFFF;
  --pic:#0A3976; --pic-ink:#FFFFFF; --sic:#A9BEDD; --sic-ink:#0A1F3F;
  --flight:#2B3C49; --flight-ink:#F1F4F5;
  --ok:#2C7A4C; --warn:#9A6514; --crit:#B3372B;
  --ok-bg:#E2F0E7; --warn-bg:#FAEFD9; --crit-bg:#F8E0DC; --info-bg:#E4EBF5;
  --conflict:#C2443A; --event:#1F7F74; --weekend:#F1F3F7; --today-bg:#DCE5F2;
  --s1:#0A3976; --s2:#7D9CCB; --s3:#C7D2E2; --s4:#B07A2A; --s5:#8A4F9E; --s6:#B3372B;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#0A3976; --brand-ink:#FFFFFF; --brand-2:#082E60;
  --bg:#0A111C; --surface:#111B2A; --surface-2:#182538; --line:#263449; --ink:#E3E9F2; --muted:#94A2B6;
  --accent:#8EB0E6; --accent-ink:#071A33;
  --pic:#7FA3DD; --pic-ink:#071A33; --sic:#2A4673; --sic-ink:#E3E9F2;
  --flight:#C6D3DA; --flight-ink:#0D151B;
  --ok:#5BBA83; --warn:#E3A84C; --crit:#EF7B6E;
  --ok-bg:#15301F; --warn-bg:#352812; --crit-bg:#3A1A17; --info-bg:#16243A;
  --conflict:#EF7B6E; --event:#5CC4B5; --weekend:#141F30; --today-bg:#1A2F52;
  --s1:#8EB0E6; --s2:#3C5F95; --s3:#36465E; --s4:#D9A04A; --s5:#B583C6; --s6:#EF7B6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#0A3976; --brand-ink:#FFFFFF; --brand-2:#082E60;
  --bg:#0A111C; --surface:#111B2A; --surface-2:#182538; --line:#263449; --ink:#E3E9F2; --muted:#94A2B6;
  --accent:#8EB0E6; --accent-ink:#071A33;
  --pic:#7FA3DD; --pic-ink:#071A33; --sic:#2A4673; --sic-ink:#E3E9F2;
  --flight:#C6D3DA; --flight-ink:#0D151B;
  --ok:#5BBA83; --warn:#E3A84C; --crit:#EF7B6E;
  --ok-bg:#15301F; --warn-bg:#352812; --crit-bg:#3A1A17; --info-bg:#16243A;
  --conflict:#EF7B6E; --event:#5CC4B5; --weekend:#141F30; --today-bg:#1A2F52;
  --s1:#8EB0E6; --s2:#3C5F95; --s3:#36465E; --s4:#D9A04A; --s5:#B583C6; --s6:#EF7B6E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--brand);color:var(--brand-ink);border-bottom:1px solid var(--brand-2)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .mark{width:92px;height:23px;flex:none;color:var(--brand-ink)}
.brand .names{display:grid;gap:1px;padding-left:14px;border-left:1px solid rgba(255,255,255,.28)}
header.top .status{color:rgba(255,255,255,.78)}
header.top .btn{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.45)}
header.top .btn:hover{background:rgba(255,255,255,.12)}
.top-row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand h1{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0;letter-spacing:.005em;text-wrap:balance}
.brand .sub{font-size:10.5px;color:rgba(255,255,255,.75);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.acstrip{display:flex;gap:8px 22px;flex-wrap:wrap;align-items:flex-end}
.acstrip div{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.acstrip small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:-1px}
.tabs button{appearance:none;border:0;background:none;padding:9px 12px 10px;font:600 13.5px var(--f-body);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
header.top .tabs button{color:rgba(255,255,255,.72)}
header.top .tabs button:hover{color:#fff}
header.top .tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.status{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.live::before{background:var(--ok)} .status.local::before{background:var(--warn)}

main .wrap{padding-block:20px 56px;display:grid;gap:28px}
.panel{display:grid;gap:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0;max-width:75ch}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit);background:var(--surface)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr[data-edit]{cursor:pointer}
.t tbody tr[data-edit]:hover td{background:var(--surface-2)}
.t .empty td{color:var(--muted);cursor:default;padding:16px 10px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.muted{color:var(--muted)}
.clip{max-width:34ch}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--info-bg);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.seat{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap}
.seat.pic{background:var(--pic);color:var(--pic-ink)} .seat.sic{background:var(--sic);color:var(--sic-ink)} .seat.oth{background:var(--line, #e5e5e5);color:inherit}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{padding:12px 14px;display:grid;gap:2px}
.stat small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat strong{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.crit strong{color:var(--crit)} .stat.warn strong{color:var(--warn)}

.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.att li:last-child{border-bottom:0}
.att li:hover{background:var(--surface-2)}
.att .what{min-width:0}
.att .what b{font-weight:600;display:block}
.att .what span{color:var(--muted);font-size:12.5px;display:block;overflow-wrap:anywhere}
.att .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.att .clear{padding:18px 12px;color:var(--muted);cursor:default}
@media (max-width:560px){.att li{grid-template-columns:minmax(0,1fr) auto}.att li .chip{grid-column:1/-1;justify-self:start;order:-1}}

/* Timeline */
.tl{--lab:150px;--dw:26px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tl-row{display:grid;grid-template-columns:var(--lab) repeat(var(--n),var(--dw));grid-template-rows:24px 8px;border-bottom:1px solid var(--line);min-width:max-content}
.tl-row:last-child{border-bottom:0}
.tl-row.head{grid-template-rows:auto;background:var(--surface)}
.tl-row.months{grid-template-rows:22px}
.tl-lab{grid-row:1/-1;grid-column:1;position:sticky;left:0;z-index:3;background:var(--surface);padding:3px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0;font-size:12.5px;line-height:1.2}
.tl-lab b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab small{color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.tl-cell{grid-row:1/-1;border-right:1px solid var(--line);opacity:1}
.tl-cell.we{background:var(--weekend)}
.tl-cell.td{background:var(--today-bg)}
.tl-cell.add{cursor:cell}
.tl-cell.add:hover{background:var(--surface-2)}
.tl-day{grid-row:1;text-align:center;font-family:var(--f-mono);font-size:11px;line-height:1.15;padding:4px 0;border-right:1px solid var(--line);color:var(--muted)}
.tl-day b{display:block;font-weight:500;color:var(--ink);font-size:11.5px}
.tl-day.we{background:var(--weekend)}
.tl-day.td{background:var(--accent);color:var(--accent-ink)} .tl-day.td b{color:var(--accent-ink)}
.tl-month{grid-row:1;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:4px 6px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.bar{grid-row:1;align-self:center;height:18px;margin:0 2px;border-radius:4px;border:0;padding:0 6px;font:600 10.5px var(--f-body);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1;background:var(--pic);color:var(--pic-ink)}
.bar.sic{background:var(--sic);color:var(--sic-ink)}
.bar.flight{background:var(--flight);color:var(--flight-ink)}
.bar.flight.ant{background:transparent;border:1.5px dashed var(--flight);color:var(--ink)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.cbar{grid-row:2;align-self:start;height:5px;margin:0 2px;border:0;padding:0;border-radius:2px;cursor:pointer;z-index:1;background:repeating-linear-gradient(135deg,var(--conflict) 0 3px,transparent 3px 6px)}
.cbar.soft{opacity:.5}
.bar.ev{background:transparent;border:1.5px solid var(--event);color:var(--event)}
.ebar{grid-row:2;align-self:end;height:4px;margin:0 2px;border:0;padding:0;border-radius:2px;cursor:pointer;z-index:1;background:var(--event)}
.tl-row.cov{grid-template-rows:22px}
.cov-c{grid-row:1;display:grid;place-items:center;border-right:1px solid var(--line);font:600 10px var(--f-mono)}
.cov-c.ok::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cov-c.gap{background:var(--crit-bg);color:var(--crit)}
.cov-c.gap::after{content:"!"}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.lg-pic{background:var(--pic)} .lg-sic{background:var(--sic)} .lg-fl{background:var(--flight)}
.lg-ant{border:1.5px dashed var(--flight)} .lg-ev{border:1.5px solid var(--event)} .lg-con{background:repeating-linear-gradient(135deg,var(--conflict) 0 3px,transparent 3px 6px)}
.lg-gap{background:var(--crit-bg);border:1px solid var(--crit)}

/* Pilot cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.pcard{display:grid;grid-template-rows:auto 1fr auto}
.pcard-h{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.pcard-h .meta{color:var(--muted);font-size:12.5px;flex:1 1 auto;min-width:0}
.pcard-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}


/* Maintenance */
.basis{padding:12px 14px;display:grid;gap:10px}
.basis-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.lbl{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.ctrs{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ctrs b{font-family:var(--f-body);font-weight:600;font-size:12px;margin-right:4px}
.tchip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 12px var(--f-body);padding:4px 9px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tchip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tchip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.tchip .num{color:var(--muted);font-size:11.5px}
.search{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;flex:1 1 220px;min-width:0;max-width:360px}
.sub{color:var(--muted);font-size:11.5px;margin-top:1px;font-family:var(--f-body)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}
.mxt td:nth-child(2){min-width:240px}
.t td.sub.clip{min-width:260px;max-width:52ch}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:10.5px var(--f-mono)}
.chart .vl{fill:var(--ink);font:500 10.5px var(--f-mono)}
.cgrid{display:grid;grid-template-columns:110px repeat(var(--m),minmax(44px,1fr)) 150px;min-width:max-content;font-size:12px}
.cgrid>div{border-bottom:1px solid var(--line);padding:6px 6px;min-height:38px;display:flex;align-items:center}
.cgrid .ch{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-height:0;justify-content:center}
.cgrid .ch.cl,.cgrid .ch.cn{justify-content:flex-start}
.cgrid .cl{flex-direction:column;align-items:flex-start;justify-content:center;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.cgrid .cl small,.cgrid .cn small{color:var(--muted);font-size:10.5px}
.cgrid .cn{flex-direction:column;align-items:flex-start;justify-content:center;border-left:1px solid var(--line)}
.cgrid .cc{justify-content:center;gap:3px;flex-wrap:wrap}
.cgrid .yr{border-left:1px dashed var(--line)}
.dot{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 3px;border-radius:10px;background:var(--s1);color:var(--accent-ink);font:500 10.5px var(--f-mono)}
.dot.od{background:var(--crit);color:#fff}
.linkish{appearance:none;border:0;background:none;padding:0;font:600 13px var(--f-body);color:var(--accent);cursor:pointer;text-align:left}
.sumrow{display:flex;flex-wrap:wrap;gap:8px 22px}
.sumrow small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sumrow b{font-size:16px;font-weight:500}
.conf{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;background:var(--muted)}
.conf.green{background:var(--ok)} .conf.yellow{background:var(--warn)} .conf.red{background:var(--crit)}
.src{padding:10px 14px;font-size:12.5px} .src summary{cursor:pointer;font-weight:600} .src ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.src a{color:var(--accent)}
.mxd{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.mxd small{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mxd span{overflow-wrap:anywhere}
.legend i{display:inline-block}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(8,16,22,.45)}
dialog form{display:grid;gap:12px;padding:16px 18px 18px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:4px}
.field label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .help{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-f{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.err{color:var(--crit);font-size:12.5px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:50}
@media (prefers-reduced-motion:no-preference){.bar,.btn,.att li{transition:background-color .12s,filter .12s}}

/* ---------- graphical layer: tiles, gauges, nav, calendar, login ---------- */
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs .ic{width:17px;height:17px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;margin:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible}
  .tabs button{flex:1 1 0;flex-direction:column;gap:2px;padding:6px 2px 4px;font-size:10.5px;border-bottom:0;border-top:2px solid transparent;min-width:0}
  .tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
  header.top .tabs button{color:var(--muted);border-bottom:0}
  header.top .tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
  .brand .mark{width:76px;height:19px}
  .brand{gap:11px} .brand .names{padding-left:11px}
  .tabs .ic{width:22px;height:22px}
  main .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .acstrip{display:none}
  .top-row{padding-block:10px 6px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr;gap:10px}}
.tile{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:150px;position:relative;overflow:hidden;border-top:4px solid var(--line)}
.tile:hover{background:var(--surface-2)}
.tile.ok{border-top-color:var(--ok)} .tile.warn{border-top-color:var(--warn)} .tile.crit{border-top-color:var(--crit)} .tile.acc{border-top-color:var(--accent)}
.tile-h{display:flex;align-items:center;gap:8px;font:600 13px var(--f-display);letter-spacing:.01em}
.tile-h .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--accent);flex:none}
.tile.crit .tile-h .ico{background:var(--crit-bg);color:var(--crit)} .tile.warn .tile-h .ico{background:var(--warn-bg);color:var(--warn)} .tile.ok .tile-h .ico{background:var(--ok-bg);color:var(--ok)}
.tile-b{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.tile-b .big{font:500 34px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.tile.crit .big{color:var(--crit)} .tile.warn .big{color:var(--warn)}
.tile-f{font-size:12px;color:var(--muted);line-height:1.35;min-width:0;overflow-wrap:anywhere}
.tile.wide{grid-column:1/-1;min-height:0}
.tile.action{min-height:0;grid-template-rows:auto;border-top-width:1px;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tile.action:hover{background:var(--brand);filter:brightness(1.12)}
.tile.action .tile-h .ico{background:rgba(255,255,255,.18);color:inherit}
.ring{flex:none;display:block}
.ring .trk{stroke:var(--surface-2)}
.ring .val{transition:stroke-dashoffset .5s}
.ring text{font:600 13px var(--f-mono);fill:var(--ink)}
.ring .rs{font:500 7.5px var(--f-body);fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.st-ok{stroke:var(--ok)} .st-warn{stroke:var(--warn)} .st-crit{stroke:var(--crit)} .st-none{stroke:var(--muted)} .st-acc{stroke:var(--accent)}
.pbar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.pbar.warn i{background:var(--warn)} .pbar.crit i{background:var(--crit)} .pbar.none i{background:var(--muted)}
.pbar.crit{background:var(--crit-bg)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:600 11.5px var(--f-body);background:var(--pic);color:var(--pic-ink);flex:none;letter-spacing:.02em}
.av.sic{background:var(--sic);color:var(--sic-ink)} .av.oth{background:var(--surface-2);color:var(--muted)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.avs{display:flex;flex-wrap:wrap;gap:4px}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
/* attention cards */
.att li{border-left:4px solid var(--line)}
.att li.crit{border-left-color:var(--crit)} .att li.warn{border-left-color:var(--warn)}
/* training cards */
.tcard{display:grid}
.tcard-h{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.tcard-h .who{flex:1 1 auto;min-width:0;display:grid;gap:3px}
.tcard-h .who b{font:600 15px var(--f-display)}
.tcard-h .who>span{font-size:12px;color:var(--muted)}
.ti{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.ti:last-child{border-bottom:0}
.ti:hover{background:var(--surface-2)}
.ti .nm{font-weight:600;font-size:13.5px;min-width:0}
.ti .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ti .pbar{grid-column:1/-1}
.ti .dt{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.tcard-f:empty{display:none}
.tcard-f{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.gauge{display:flex;align-items:center;gap:14px;padding:12px 14px}
.gauge div{display:grid;gap:2px;min-width:0}
.gauge small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gauge b{font:600 15px var(--f-display)}
.gauge span{font-size:12px;color:var(--muted)}
.rem{min-width:110px}
.rem .pbar{margin-top:5px}
/* month calendar */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 12.5px var(--f-body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dh{background:var(--surface);text-align:center;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.cal .dc{appearance:none;border:0;font:inherit;color:inherit;text-align:left;background:var(--surface);min-height:86px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.cal .dc:hover{background:var(--surface-2)}
.cal .dc.out{background:var(--bg);color:var(--muted)}
.cal .dc.we{background:var(--weekend)}
.cal .dc.gap{background:var(--crit-bg)}
.cal .dc .n{font:500 12px var(--f-mono);display:flex;justify-content:space-between;align-items:center}
.cal .dc.td .n b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cal .dc .n b{font-weight:600}
.cal .dc .fl{height:4px;border-radius:2px;background:var(--flight)}
.cal .dc .fl.ant{background:transparent;border-top:2px dashed var(--flight);height:0}
.cal .dc .cf{height:4px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--conflict) 0 3px,transparent 3px 6px)}
.cal .dc .ev{height:4px;border-radius:2px;background:var(--event)}
.cal .dc .avs{gap:2px}
.cal .dc .more{font:600 10px var(--f-mono);color:var(--muted);align-self:center}
.cal .dc .gp{font:700 9.5px var(--f-body);color:var(--crit);letter-spacing:.05em;text-transform:uppercase}
@media (max-width:520px){.cal .dc{min-height:64px;padding:3px}.cal .av.sm{width:17px;height:17px;font-size:8px}.cal .dh{font-size:9.5px;letter-spacing:.03em}}
.daylist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.daylist li{display:flex;align-items:center;gap:10px;font-size:13.5px}
.daylist li span{color:var(--muted);font-size:12px}
/* squawk cards */
.sqc{display:grid;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);border-left:4px solid var(--warn);cursor:pointer}
.sqc:last-child{border-bottom:0}
.sqc:hover{background:var(--surface-2)}
.sqc.ok{border-left-color:var(--ok)} .sqc.crit{border-left-color:var(--crit)} .sqc.none{border-left-color:var(--muted)}
.sqc b{font-weight:600}
.sqc .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
/* login */
.login{min-height:calc(100dvh - 120px);display:grid;place-items:center;padding:24px 0}
.login form{width:min(380px,100%);display:grid;gap:14px;padding:26px 22px;border-radius:16px}
.login .logo{width:100%;height:auto;padding:22px 20px 18px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.login .logo svg{width:min(220px,70%);height:auto;aspect-ratio:370/198;display:block}
.login h2{font-size:22px}
.login .chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.login .btn{padding:10px 14px;font-size:15px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
body.locked .tabs,body.locked #acstrip,body.locked #pushbtn{display:none!important}
.pw{font-family:var(--f-mono);letter-spacing:.02em}
</style>

<style id="apg-css">
.apg-list{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.apg-row{appearance:none;font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;width:100%}
.apg-row:last-child{border-bottom:0}.apg-row:hover{background:var(--surface-2)}
.apg-row b{font:600 15px var(--f-mono)}.apg-row .nm{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apg-row .sub{font-size:12px;color:var(--muted)}.apg-row.none{cursor:default;opacity:.7}
.apg-q{width:100%;box-sizing:border-box;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.apg-v{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.apg-vh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--brand);color:var(--brand-ink)}
.apg-vh .btn{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.45)}
.apg-vh .t{flex:1;min-width:0;font:600 14px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apg-vb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;display:grid;gap:10px;justify-items:center;align-content:start}
.apg-vb canvas{background:#fff;max-width:100%;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.apg-vb iframe{width:100%;height:100%;border:0;background:#fff}
</style>
<style id="ft-css">
.ft{gap:12px}
.ft-hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ft-g{margin:6px 0 0;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ft-row{appearance:none;font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:48px;box-sizing:border-box}
button.ft-row{cursor:pointer}button.ft-row:hover{background:var(--surface-2)}
.ft-row:last-child{border-bottom:0}
.ft-row:not(:has(.ico)){grid-template-columns:minmax(0,1fr) auto}
.ft-row .ico{color:var(--brand)}.ft-row .ico .ic{width:20px;height:20px}
.ft-row .nm{min-width:0;display:grid;gap:2px}.ft-row .nm b{font-weight:600}
.ft-row .sub{font-size:12.5px;color:var(--muted)}
.ft-tags.l{justify-content:flex-start;margin-top:4px}
.ft-chev{font-size:22px;color:var(--muted);line-height:1}
.ft-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ft-ph{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--warn);border-radius:8px;background:var(--warn-bg);color:var(--ink);font-size:13px}
.ft-ph .ic{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.ft-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.ft-ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button.ft-ch{appearance:none;border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer;width:100%;text-align:left;min-height:32px}
.ft-mh span{color:var(--muted);font-size:13px}
.ft-big{font:600 18px/1.3 var(--f-display)}
.ft-grid2,.ft-grid3{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:620px){.ft-grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ft-f{display:grid;gap:4px;min-width:0}.ft-f>span{font-size:12px;color:var(--muted);font-weight:600}
.ft input,.ft select,.ft textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box;min-height:44px}
.ft textarea{min-height:66px;resize:vertical}
.ft input[type=checkbox],.ft input[type=radio]{width:22px;height:22px;min-height:0;margin:0;flex:none;accent-color:var(--brand)}
.ft-tm{display:flex;gap:6px;align-items:center}.ft-tm input{font-family:var(--f-mono)}.ft-tm .btn{min-height:44px}
.ft-calc{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;background:var(--surface-2,#EEF2F7);border-radius:8px;font-size:13.5px}
.ft-calc b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ft-calc.big{font-size:15px}.ft-calc.col{display:grid;gap:8px}
.ft-calc.col span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ft-row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ft-row2 .btn{min-height:44px}
.ft .btn.sm{min-height:38px;padding-inline:12px}
.ft-tags .btn.sm{min-width:44px}
.ft-checks{gap:0;padding:4px 12px}
.ft-ck{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:28px}
.ft-ck:last-child{border-bottom:0}.ft-ck small{color:var(--muted)}
.ft-q{display:grid;gap:2px;padding-top:6px}.ft-q .ft-ck{border-bottom:0;padding:6px 0}
.ft-stages{display:flex;flex-wrap:wrap;gap:6px}
.ft-stages span{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.ft-stages span.on{border-color:var(--brand);color:var(--brand);font-weight:600}
.ft-sec{display:grid;gap:2px}.ft-sec small{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ft-mono{font-family:var(--f-mono);font-size:12px}
.ft-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ft-grid{font-size:12.5px;width:100%}
.ft-grid th,.ft-grid td{padding:7px 6px;text-align:center;white-space:nowrap}
.ft-grid th:first-child,.ft-grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.ft-grid td:first-child small{display:block;color:var(--muted);font-size:11px}
.ft-grid .chip{font-size:11px;padding:2px 6px}
.ft-acc{width:auto;min-width:100%}.ft-acc td:first-child{min-width:150px;white-space:normal}.ft-acc th:not(:first-child),.ft-acc td.c{width:56px;text-align:center}
.ft-acc td.c{text-align:center;font-weight:700;color:var(--ok)}
.ft-acc th{white-space:nowrap}
.ft-t{width:100%}.ft-t .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ft-cardt td{font-size:15px;padding:9px 8px}.ft-cardt b{font-size:17px}
.ft-cardt tr.ft-note td{font-size:12px;color:var(--muted);padding-top:0}
.ft-months{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ft-m{appearance:none;font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;display:grid;gap:2px;justify-items:center;cursor:pointer;min-height:52px}
.ft-m small{font-size:11px;color:var(--muted)}.ft-m b{font:600 18px var(--f-mono)}
.ft-m.warn b{color:var(--warn)}.ft-m.crit{border-color:var(--crit)}.ft-m.crit b{color:var(--crit)}
.ft-strip{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:10px;margin-bottom:14px}
.ft-strip.none{border-left-color:var(--muted)}.ft-strip.none .ft-dot{background:var(--muted)}
.ft-strip.warn{border-left-color:var(--warn)}.ft-strip.crit{border-left-color:var(--crit)}
.ft-s1{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ft-s1 b{font:600 17px var(--f-display)}.ft-s1>span:last-child{color:var(--muted);font-size:13px}
.ft-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.ft-strip.warn .ft-dot{background:var(--warn)}.ft-strip.crit .ft-dot{background:var(--crit)}
.ft-s2{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));font-size:13.5px}
.ft-s2>span{display:grid;gap:2px;justify-items:start}.ft-s2 small{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ft-s3{display:flex;flex-wrap:wrap;gap:6px}
.ft-age{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.ft-age.warn{background:var(--warn-bg);color:var(--warn)}.ft-age.none{background:var(--info-bg);color:var(--muted)}
.ft-sub{display:grid;gap:6px;margin-top:8px}
.ft-sub>span{display:block;font-size:12.5px;color:var(--ink)}.ft-sub i{font-style:normal;color:var(--muted)}
/* layout updates */
body.ft-acct #pwbtn,body.ft-acct #logoutbtn{display:none!important}
#ft-acct-btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.45);min-height:32px}
#ft-acct-menu{position:absolute;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(15,31,51,.18);display:grid;min-width:180px;overflow:hidden}
#ft-acct-menu button{appearance:none;border:0;background:none;font:500 15px var(--f-body);color:var(--ink);text-align:left;padding:13px 16px;min-height:48px;cursor:pointer;border-bottom:1px solid var(--line)}
#ft-acct-menu button:last-child{border-bottom:0}#ft-acct-menu button:hover{background:var(--surface-2)}
.ft-tlnote{margin:2px 0 0}
@media (max-width:640px){
 body.ft-phone .ft-stack table,body.ft-phone .ft-stack tbody{display:block;width:100%}
 body.ft-phone .ft-stack thead{display:none}
 body.ft-phone .ft-stack tr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:10px 12px;border-bottom:1px solid var(--line)}
 body.ft-phone .ft-stack tr:last-child{border-bottom:0}
 body.ft-phone .ft-stack td{display:inline;padding:0;border:0;white-space:normal}
 body.ft-phone .ft-stack td:first-child{font-weight:600}
 body.ft-phone .ft-stack td.num{white-space:nowrap;font-size:12.5px}
 body.ft-phone .ft-stack td.muted,body.ft-phone .ft-stack td.clip{flex-basis:100%;font-size:12px;max-width:none}
 body.ft-phone .ft-stack td:empty{display:none}
 body.ft-phone .ft-rot td:nth-child(4)::before{content:"("}body.ft-phone .ft-rot td:nth-child(4)::after{content:" d)"}
 body.ft-phone .ft-rot td:nth-child(5){flex-basis:100%;font-size:12px;color:var(--muted)}
 body.ft-phone .ft-stack tr.empty td{font-weight:400}
}
@media (max-width:520px){
 body.ft-cal .cal .dc{min-height:72px}
 body.ft-cal .cal .dc .avs{display:flex;flex-wrap:wrap;gap:2px}
 body.ft-cal .cal .av.sm{width:22px;height:18px;border-radius:5px;font-size:10px}
}
.ft-fold{border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px;padding:0 12px}
.ft-foldh{appearance:none;border:0;background:none;font:inherit;color:inherit;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;cursor:pointer;width:100%;text-align:left;padding:0}
.ft-foldh span{color:var(--muted);font-size:13px}
.ft-fold>section{padding-bottom:12px}
</style>

    <text x="32" y="${sub ? 32 : 36.5}" text-anchor="middle">${esc(label)}</text>${sub ? `<text x="32" y="43" text-anchor="middle" class="rs">${esc(sub)}</text>` : ""}</svg>`;

/* Share of the interval left before the hard deadline, for progress bars. */
function trainFrac(t, st) {
  if (!st || !st.due) return null;
  const l = parse(t.lastDone);
  let span = l ? diff(l, st.due) : null;
  if (!span || span <= 0) { const m = Number(t.intervalMonths) || Number(((t.notes || "").match(/Interval:\s*(\d+)/) || [])[1]); span = m ? m * 30.44 : 365; }
  return st.days < 0 ? 0 : clamp01(st.days / span);
}
function mxFrac(it, nx, C) {
  if (!nx) return null;
  C = C || counters();
  const ctr = C[it.ctr] || C.af;
  if (nx.days < 0) return 0;
  if (nx.g === "Flight hours" && it.Ihrs && ctr.h != null && it.Lhrs != null) return clamp01((it.Lhrs - ctr.h) / it.Ihrs);
  if ((nx.g === "Landings" || nx.g === "Cycles") && (it.Ildg || it.Icyc) && ctr.c != null) return clamp01(((it.Lldg ?? it.Lcyc) - ctr.c) / (it.Ildg || it.Icyc));
  if (it.Imo) return clamp01(nx.days / (it.Imo * 30.44));
  return null;
}
function coverage30() {
  if (!S.rotations.length) return null;
  let ok = 0; for (let i = 0; i < 30; i++) if (covered(crewOn(addDays(TODAY, i)))) ok++;
  return ok / 30;
}
function nextCheck(C) {
  C = C || counters();

}

}

/* ---------- month calendar ---------- */
function monthCal() {
  const first = new Date(TODAY.getFullYear(), TODAY.getMonth() + ui.calOff, 1);
  const start = mondayOf(first);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const end = addDays(mondayOf(last), 6);
  const anyRot = S.rotations.length > 0;
  const cons = allConflicts();
  let cells = "";
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const c = crewOn(d);
    const all = S.rotations.filter(r => onDay(r, d)).map(r => pilotById(r.pilotId)).filter(Boolean);
    const ps = [...new Map(all.map(p => [p.id, p])).values()].sort((a, b) => (SEAT_ORDER[a.seat] ?? 9) - (SEAT_ORDER[b.seat] ?? 9));
    const fl = S.flights.filter(f => onDay(f, d));
    const cf = cons.filter(x => onDay(x, d));
    const evs = S.events.filter(x => onDay(x, d));
    const gap = anyRot && !covered(c) && d >= TODAY;
    const show = ps.slice(0, 4);
    cells += `<button type="button" class="dc${d.getMonth() !== first.getMonth() ? " out" : ""}${isWE(d) ? " we" : ""}${+d === +TODAY ? " td" : ""}${gap ? " gap" : ""}" data-day="${iso(d)}" aria-label="${esc(fmt(d))}: ${ps.length ? esc(ps.map(p => p.name).join(", ")) : "nobody"}${gap ? ", crew gap" : ""}">

      ${fl.map(f => `<span class="fl${f.status === "Anticipated" ? " ant" : ""}" title="${esc(f.route)}"></span>`).join("")}
      ${evs.length ? `<span class="ev" title="${esc(evs.map(x => x.title).join(", "))}"></span>` : ""}
      ${cf.length ? `<span class="cf" title="Conflict"></span>` : ""}

    </button>`;
  }
  return `<div class="panel-h"><h2>${first.toLocaleDateString("en-US", {month:"long", year:"numeric"})}</h2>

}

function genPassword() {
  // Easy to remember: Word-Word-NN (e.g. Coral-Falcon-27).
  const W = ["Anchor","Bravo","Coral","Delta","Falcon","Harbor","Island","Kestrel","Lagoon","Mango","Orchid","Pelican","Reef","Tango","Summit","Heron","Ocean","Rudder","Beacon","Cobalt","Juniper","Kayak","Glider","Atlas","Comet","Marlin","Osprey","Palm","Trident","Breeze"];
  const r = new Uint32Array(3); crypto.getRandomValues(r);
  let a = W[r[0] % W.length], b = W[r[1] % W.length]; if (a === b) b = W[(r[1] + 1) % W.length];
  return `${a}-${b}-${10 + (r[2] % 90)}`;
}
const randSalt = () => { const b = new Uint8Array(16); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)); };

const MX_SERIES = [
  {k:"Check", l:"Letter checks", v:"--s1", types:["Check"]},
  {k:"Insp", l:"Inspections & servicing", v:"--s2", types:["Inspection/Service","Structural"]},
  {k:"Zonal", l:"Zonal", v:"--s3", types:["Zonal"]},
  {k:"EngProp", l:"Engine & propeller", v:"--s4", types:["Engine","Propeller"]},
  {k:"ADSB", l:"AD / SB", v:"--s5", types:["AD","SB/SI"]},
  {k:"Life", l:"Part life & overhaul", v:"--s6", types:["Part life/expiry"]}];
const seriesOf = t => MX_SERIES.find(s => s.types.includes(t)) || MX_SERIES[1];
const money = n => n == null ? "—" : "$" + Math.round(n).toLocaleString();
const moneyK = n => n >= 1000000 ? "$" + (n / 1000000).toFixed(2) + "M" : n >= 1000 ? "$" + Math.round(n / 1000).toLocaleString() + "k" : "$" + Math.round(n);
const ymKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const ymLabel = (k, yr) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", yr ? {month:"short", year:"2-digit"} : {month:"short"}); };
function monthsToHorizon() { const out = []; let d = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); while (d <= HORIZON) { out.push(ymKey(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); } return out; }

function stackedBars(months, data, series, opts = {}) {
  // data: {month: {seriesKey: value}}
  const W = 720, H = opts.h || 220, L = 44, R = 8, T = 10, B = 26;
  const totals = months.map(m => series.reduce((s, x) => s + ((data[m] || {})[x.k] || 0), 0));
  const max = Math.max(1, ...totals);
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const nice = [1, 2, 2.5, 5, 10].map(f => f * step).find(v => max / v <= 5) || step * 10;
  const top = Math.ceil(max / nice) * nice;
  const bw = (W - L - R) / months.length;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += nice) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${opts.fmt ? opts.fmt(v) : v}</text>`;
  months.forEach((m, i) => {
    let acc = 0; const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    for (const s of series) { const v = (data[m] || {})[s.k] || 0; if (!v) continue; g += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${Math.max(0.5, y(acc) - y(acc + v))}" style="fill:var(${s.v})"><title>${ymLabel(m, 1)} · ${s.l}: ${opts.fmt ? opts.fmt(v) : v}</title></rect>`; acc += v; }
    if (opts.labels && totals[i]) g += `<text x="${x + w / 2}" y="${y(totals[i]) - 4}" text-anchor="middle" class="vl">${opts.fmt ? opts.fmt(totals[i]) : totals[i]}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" class="ax">${ymLabel(m, m.endsWith("-01") || i === 0)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "chart")}">${g}</svg></div>`;
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const AUTH_KEY = "bta.crew.auth";
let loginErr = "", loginBusy = false;
/* Own password per device: the temporary password from Matt unlocks the site once on a device;
   the person then picks their own password, which unlocks a copy of the site key kept on this device only. */
const DEV_KEY = u => "bta.crew.dev." + u;
let CUR = null; // {u, kek} for the signed-in person
const devGet = u => { try { return JSON.parse(localStorage.getItem(DEV_KEY(u)) || "null"); } catch (x) { return null; } };
async function devSave(u, pw, kekRaw) {
  const salt = new Uint8Array(16); crypto.getRandomValues(salt);
  const iv = new Uint8Array(12); crypto.getRandomValues(iv);
  const dk = await crypto.subtle.importKey("raw", await deriveKek(pw, b64e(salt), ENC.it), "AES-GCM", false, ["encrypt"]);
  const k = await crypto.subtle.encrypt({name:"AES-GCM", iv}, dk, kekRaw);
  localStorage.setItem(DEV_KEY(u), JSON.stringify({s:b64e(salt), iv:b64e(iv), k:b64e(k), at:new Date().toISOString()}));
}
async function devOpen(u, pw) {
  const d = devGet(u); if (!d) return null;
  try { return new Uint8Array(await aesOpen(await deriveKek(pw, d.s, ENC.it), d.iv, d.k)); } catch (x) { return null; }
}
async function sha16(text) { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(h)].slice(0, 8).map(x => x.toString(16).padStart(2, "0")).join(""); }
async function deriveKek(pw, salt, it) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64d(salt), iterations:it}, base, 256));
}
async function aesOpen(keyRaw, iv, ct) {
  const key = await crypto.subtle.importKey("raw", keyRaw, "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(iv)}, key, b64d(ct)));
}
const jsonOf = b => JSON.parse(new TextDecoder().decode(b));
/* v1: one blob for everyone. v2: a shared blob plus a training blob each login may open (their own, or everyone's). */
async function openWith(user, kekRaw) {
  const ent = ENC.u[await sha16("bta-user:" + user)];
  if (!ent) throw new Error("nouser");
  const wrapped = await aesOpen(kekRaw, ent.iv, ent.k);
  if (ENC.v !== 2) return {data: jsonOf(await aesOpen(wrapped, ENC.iv, ENC.ct)), me: null};
  const w = jsonOf(wrapped);
  const data = jsonOf(await aesOpen(b64d(w.c), ENC.c.iv, ENC.c.ct));
  data.training = [];
  if (w.t && w.tb && ENC.t[w.tb]) {
    const x = jsonOf(await aesOpen(b64d(w.t), ENC.t[w.tb].iv, ENC.t[w.tb].ct));
    data.training = x.training || [];
    if (Array.isArray(x.pilots)) data.pilots = (data.pilots || []).map(p => ({...p, ...(x.pilots.find(q => q.id === p.id) || {})}));
  }
  return {data, me: w.me || null, apg: w.a || null, qk: w.q || null, ck: w.k || null, fk: w.f || null, fa: w.fa || null};
}

let APGK = null; const APG = {index: null, err: "", saved: null, q: "", busy: false};

  let have = 0;

   given only to the logins on the build's quote list; opens full screen and works offline. */

async function qqOpenBuf(buf) {
  const k = await crypto.subtle.importKey("raw", b64d(QQK), "AES-GCM", false, ["decrypt"]);
  const b = new Uint8Array(buf);

}

const ftOn = id => !!(FK && FK[id]);

const ftDef = id => FT_LIST.find(f => f.id === id);

/* storage on this device, per person */
const ftSK = id => "bta.ft." + String((ME && (ME.pilotId || ME.name)) || "me").toLowerCase().replace(/[^a-z0-9-]+/g, "") + "." + id;
function ftGet(id, def) { try { const v = JSON.parse(localStorage.getItem(ftSK(id)) || "null"); return v == null ? def : v; } catch (x) { return def; } }
function ftSet(id, v) { try { localStorage.setItem(ftSK(id), JSON.stringify(v)); } catch (x) { toast("Couldn't save on this device."); } }
const FT_ST = {};
const ftS = (id, def) => (FT_ST[id] = FT_ST[id] || ftGet(id, def));
const ftSave = id => ftSet(id, FT_ST[id]);
function ftPath(obj, path, val) {
  const ks = path.split("."); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; }
  if (val === undefined) return o[ks[ks.length - 1]];
  o[ks[ks.length - 1]] = val;
}

/* encrypted content */
async function ftOpenBuf(id, buf) {
  const k = await crypto.subtle.importKey("raw", b64d(FK[id]), "AES-GCM", false, ["decrypt"]);
  const b = new Uint8Array(buf);
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: b.subarray(0, 12)}, k, b.subarray(12)));
}
async function ftBoot() {
  if (!FK) return;
  let c = null; try { c = await caches.open(APG_CACHE); } catch (x) {}
  for (const [id, f] of Object.entries(FT_FILES)) {
    if (!ftOn(id)) continue;
    try {
      const buf = await apgFetch(f);
      if (c) { try { await c.put(f, new Response(buf.slice(0))); } catch (x) {} }
      FT_DATA[id] = JSON.parse(new TextDecoder().decode(await ftOpenBuf(id, buf))); delete FT_ERR[id];
    } catch (x) { FT_ERR[id] = x.message === "offline" ? "Not saved on this device yet. Connect once to download it." : "Couldn't open this feature's content."; }
  }
  scheduleRender();
}

function ftWrap(tab, html) {

/* ---------- Board layout: status strip ---------- */
function ftAge(dateStr, label, warnDays = 3) {
  const d = dateStr ? new Date(/T/.test(dateStr) ? dateStr : String(dateStr).slice(0, 10) + "T12:00:00") : null;
  if (!d || isNaN(d)) return `<span class="ft-age none">${esc(label)}: <b>not tracked yet</b></span>`;
  const days = Math.floor((Date.now() - d) / 864e5);
  return `<span class="ft-age ${days > warnDays ? "warn" : "ok"}">${esc(label)}: <b>${esc(fmtS(d))}</b>${days > warnDays ? ` · ${days} days old` : ""}</span>`;
}
function ftStatus() {
  const C0 = counters(), chk = nextCheck(C0);
  const inWork = S.mxPlan.filter(p => p.status === "In work");
  const openSq = allSquawks().filter(q => q.status === "Open");
  const today = iso(TODAY);
  const fl = S.flights.filter(f => (f.end || f.start) >= today).sort((a, b) => String(a.start).localeCompare(String(b.start)));
  const flyingToday = fl.find(f => onDay(f, TODAY));

  if (sts.some(s => s.inGrace)) return {st: "crit", l: "Grace"};

}
function ftLegal(p) {

    ${Object.keys(byCat).length ? `<h3 class="ft-g">${esc(q)} by category</h3><div class="apg-list">${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="ft-row"><span class="nm">${esc(c)}</span><b>${esc(money(v))}</b></div>`).join("")}</div>` : ""}
    <div class="ft-card"><div class="ft-grid2">${ftField("Flight hours, last 12 months", ftIn("exp:hours", s.hours, `inputmode="decimal" placeholder="from JetInsight"`))}<div class="ft-f"><span>Cost per flight hour</span><b class="ft-big">${hrs ? esc(money(y12 / hrs)) : "—"}</b></div></div><p class="hint">Will feed Quick Quote's hourly cost once the numbers are settled.</p></div>
    ${s.items.length ? `<h3 class="ft-g">Recent</h3><div class="apg-list">${s.items.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 30).map(x => `<div class="ft-row"><span class="nm"><b>${esc(money(ftNum(x.amt)))} · ${esc(x.cat)}</b><span class="sub">${esc(fmtS(parse(x.date)))}${x.trip ? ` · ${esc(x.trip)}` : ""}${x.note ? ` · ${esc(x.note)}` : ""}</span></span><button type="button" class="btn sm" data-ft-act="expDel" data-id="${esc(x.id)}" aria-label="Delete">✕</button></div>`).join("")}</div>` : ""}
    ${ftPh("Forecasts with Veryon due items and sharing with Drew come with the BTA App.")}${ftLocal()}`;
}
function ftParts() {
  return `${ftBack("Parts & inventory", ftTesting())}<p class="hint">Inventory, count mode and verification live on the BTA Parts page on claude.ai. The person also needs that page shared with their claude.ai account.</p><div class="ft-row2"><a class="btn primary" href="${PT_URL}" target="_blank" rel="noopener">Open BTA Parts</a></div>`;
}
function ftAccess() {
  if (!FA) return `${ftBack("Feature access")}<p class="hint">The access list isn't in this build.</p>`;
  const ids = FA.features || [];
  return `${ftBack("Feature access", ftTesting())}
    <p class="hint">Who has each feature in this build (${esc(FA.at ? whenS(FA.at) : "")}). To change it, tick boxes in the sheet; the next sync (every 3 hours, or after a change on the board) applies it.</p>
    ${FA.sheet ? `<div class="ft-row2"><a class="btn primary" href="${esc(FA.sheet)}" target="_blank" rel="noopener">Edit in Google Sheets</a></div>` : ""}
    ${FA.note ? ftPh(FA.note) : ""}
    <div class="ft-scroll"><table class="t ft-acc"><thead><tr><th>Feature</th>${FA.users.map(u => `<th>${esc(String(u.name).split(" ")[0])}</th>`).join("")}</tr></thead><tbody>${ids.map(id => `<tr><td>${esc((ftDef(id) || {}).name || id)}</td>${FA.users.map(u => `<td class="c">${u.f.includes(id) ? "✓" : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const FT_VIEW = {trip: ftTrip, flog: ftFlog, req: ftReq, close: ftClose, load: ftLoad, dest: ftDest, cards: ftCards, grid: () => ftGrid(false), hazmat: ftHazmat, expiry: () => ftExpiry(false), upgrade: ftUpgrade, emph: ftEmph, slides: () => ftList("slides", "Slide library"), manuals: () => ftList("manuals", "Manuals"), parts: ftParts, forecast: () => ftForecast(false), tasks: ftTasks, exp: ftExp, access: ftAccess};

/* ---------- events ---------- */
function ftSplit(k) { const i = k.indexOf(":"); return [k.slice(0, i), k.slice(i + 1)]; }
function ftSetKey(k, v) { const [id, p] = ftSplit(k); const st = ftS(id, {}); ftPath(st, p, v); ftSave(id); }
const FT_ACT = {
  now(el) { ftSetKey(el.dataset.k, ftNowZ()); scheduleRender(); },
  flogAddLeg() { const s = FT_ST.flog; const last = s.cur.legs[s.cur.legs.length - 1]; const l = ftLeg(); l.from = last ? last.to : ""; l.fs = last ? last.fe : ""; s.cur.legs.push(l); ftSave("flog"); scheduleRender(); },
  flogDelLeg(el) { const s = FT_ST.flog; s.cur.legs.splice(+el.dataset.i, 1); ftSave("flog"); scheduleRender(); },
  flogCopy() { ftShare("Flight log", ftFlogText(FT_ST.flog.cur)); },
  flogSave() { const s = FT_ST.flog; s.saved.push(s.cur); s.cur = ftFlogNew(); ftSave("flog"); toast("Log saved on this device"); scheduleRender(); },
  flogShare(el) { const g = FT_ST.flog.saved.find(x => x.id === el.dataset.id); if (g) ftShare("Flight log", ftFlogText(g)); },
  flogDel(el) { if (!confirm("Delete this saved log from this device?")) return; const s = FT_ST.flog; s.saved = s.saved.filter(x => x.id !== el.dataset.id); ftSave("flog"); scheduleRender(); },
  reqMail() { const s = FT_ST.req; location.href = ftMail(s.to, s.cc, `Trip request: N282BT ${s.f.route || ""} ${s.f.date || ""}`.trim(), ftReqText(s.f)); },
  reqCopy() { ftShare("Trip request", ftReqText(FT_ST.req.f)); },
  reqClear() { FT_ST.req.f = {}; ftSave("req"); scheduleRender(); },
  closeMail() { const s = FT_ST.close, t = s.trips[s.sel] || {}; const f = S.flights.find(x => x.id === s.sel); const name = f ? `${f.start} ${f.route || ""}` : (t.name || "trip"); const docs = FT_CLOSE.filter(([k]) => t[k] && !["ji", "duty"].includes(k)).map(([, l]) => "- " + l); location.href = ftMail(s.to, "", `Trip close-out: N282BT ${name}`, `Close-out documents for N282BT, ${name}.\n\nAttached:\n${docs.join("\n") || "- (none ticked)"}\n\n${(ME && ME.name) || ""}`); },
  loadAdd() { FT_ST.load.items.push({d: "", w: "", arm: ""}); ftSave("load"); scheduleRender(); },
  emphAck(el) { FT_ST.emph.ack[el.dataset.id] = new Date().toISOString(); ftSave("emph"); scheduleRender(); },
  taskDone(el) { FT_ST.tasks.done[el.dataset.id] = iso(TODAY); ftSave("tasks"); toast("Marked done"); scheduleRender(); },
  taskDel(el) { if (!confirm("Delete this task from this device?")) return; const s = FT_ST.tasks; s.list = s.list.filter(t => t.id !== el.dataset.id); ftSave("tasks"); scheduleRender(); },
  taskAdd() { const s = FT_ST.tasks, d = s.draft || {}; if (!String(d.title || "").trim()) { toast("Give the task a name"); return; } s.list.push({id: ftId(), title: d.title.trim(), freq: d.freq || "monthly", day: +d.day || 1, wd: +d.wd || 1, every: +d.every || 7, start: iso(TODAY), who: d.who || ""}); s.draft = {freq: d.freq || "monthly", day: "1", wd: "1", every: "7"}; ftSave("tasks"); scheduleRender(); },
  expAdd() { const s = FT_ST.exp, d = s.draft || {}; if (!ftNum(d.amt)) { toast("Enter an amount"); return; } s.items.push({id: ftId(), date: d.date || iso(TODAY), cat: d.cat || "Other", amt: ftNum(d.amt), trip: d.trip || "", note: d.note || ""}); s.draft = {date: d.date, cat: d.cat}; ftSave("exp"); scheduleRender(); },
  expDel(el) { if (!confirm("Delete this expense from this device?")) return; const s = FT_ST.exp; s.items = s.items.filter(x => x.id !== el.dataset.id); ftSave("exp"); scheduleRender(); }
};
document.addEventListener("click", e => {
  if (!FK || e.target.closest("dialog")) return;
  const ab = e.target.closest("#ft-acct-btn"); if (ab) { e.stopPropagation(); ftAcctMenu(ab); return; }
  const mi = e.target.closest("[data-ft-menu]"); if (mi) { e.stopPropagation(); const t = document.getElementById(mi.dataset.ftMenu); const m = document.getElementById("ft-acct-menu"); if (m) m.remove(); if (t) t.click(); return; }
  const om = document.getElementById("ft-acct-menu"); if (om && !e.target.closest("#ft-acct-menu")) { om.remove(); const bb = document.getElementById("ft-acct-btn"); if (bb) bb.setAttribute("aria-expanded", "false"); }
  const g = e.target.closest("[data-ft-go]");
  if (g) { e.stopPropagation(); ui.ftv = g.dataset.ftGo || null; if (g.dataset.m) ui.ftM = g.dataset.m; ui.ftDest = null; go("tools"); return; }
  const a = e.target.closest("[data-ft-act]");
  if (a && FT_ACT[a.dataset.ftAct]) { e.preventDefault(); e.stopPropagation(); FT_ACT[a.dataset.ftAct](a); return; }
  const d = e.target.closest("[data-ft-dest]");
  if (d) { e.stopPropagation(); ui.ftDest = d.dataset.ftDest || null; render(); window.scrollTo(0, 0); return; }
  const m = e.target.closest("[data-ft-m]");
  if (m) { e.stopPropagation(); ui.ftM = ui.ftM === m.dataset.ftM ? "-" : m.dataset.ftM; render(); return; }
  const fo = e.target.closest("[data-ft-fold]");
  if (fo) { e.stopPropagation(); ui.ftMxOpen = !ui.ftMxOpen; render(); return; }
  const at = e.target.closest("[data-ft-att]");
  if (at && !e.target.closest("[data-edit]")) { e.stopPropagation(); ui.ftAtt = ui.ftAtt === at.dataset.ftAtt ? null : at.dataset.ftAtt; render(); return; }
}, true);
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-ft-in]"); if (!el || el.tagName === "SELECT") return;
  ftSetKey(el.dataset.ftIn, el.value);
  if (el.dataset.ftIn === "dest:q") scheduleRender();
});
let ftRT = 0;
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.ftIn) { ftSetKey(el.dataset.ftIn, el.value); if (el.tagName === "SELECT" || el.type === "date") scheduleRender(); else { clearTimeout(ftRT); ftRT = setTimeout(scheduleRender, 350); } return; }
  if (el.dataset && el.dataset.ftCk) { ftSetKey(el.dataset.ftCk, el.checked); scheduleRender(); return; }
  if (el.dataset && el.dataset.ftRadio) { ftSetKey(el.dataset.ftRadio, +el.value); scheduleRender(); return; }
});

/* ---------- boot ---------- */
if (ENC && !SNAP) { bootLocked(); } else render();
(async () => {
  if (ENC && !SNAP) return;
  if (SNAP) { for (const c of [...COLLS, "squawkReports"]) S[c] = Array.isArray(SNAP[c]) ? SNAP[c] : []; mode = "snap"; OWNER = false; scheduleRender(); return; }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { mode = "local"; OWNER = true; scheduleRender(); return; }
  mode = "live";
  let user = null;
  try { user = await window.claude.use("user"); } catch (e) { user = null; }
  if (user) { try { OWNER = !!(await user.isOwner()); UID = await user.id(); } catch (e) {} }
  for (const c of COLLS) {
    if (!OWNER && OWNER_ONLY.has(c)) continue;
    db.collection(c).onSnapshot(
      snap => { S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); scheduleRender(); },
      () => { mode = "local"; scheduleRender(); }
    );
  }
  const listColl = k => db.collection(k).onSnapshot(snap => { S[k] = snap.docs.map(d => ({id:d.id, ...d.data()})); scheduleRender(); }, () => {});
  listColl("squawkReports");
  if (OWNER) listColl("conflictReports");
  else if (UID) db.collection("conflictReports").doc(UID).onSnapshot(snap => { S.conflictReports = snap.exists ? [{id:snap.id, ...snap.data()}] : []; scheduleRender(); }, () => {});
  scheduleRender();
})();
})();
</script>
