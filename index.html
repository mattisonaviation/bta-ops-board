<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BTA Ops Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ops board. Aircraft status strip up top, tabbed workspace, an 8-week crew timeline as the centerpiece. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E9EEF0; --line:#D2DADE; --ink:#13212B; --muted:#5A6A75;
  --accent:#0B6A84; --accent-ink:#FFFFFF;
  --pic:#0B6A84; --pic-ink:#FFFFFF; --sic:#8FC0CE; --sic-ink:#0D2A33;
  --flight:#2B3C49; --flight-ink:#F1F4F5;
  --ok:#2C7A4C; --warn:#9A6514; --crit:#B3372B;
  --ok-bg:#E2F0E7; --warn-bg:#FAEFD9; --crit-bg:#F8E0DC; --info-bg:#E3ECF0;
  --conflict:#C2443A; --weekend:#F0F3F4; --today-bg:#DDEEF3;
  --s1:#0B6A84; --s2:#7FB3C2; --s3:#C9D5DA; --s4:#B07A2A; --s5:#8A4F9E; --s6:#B3372B;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151B; --surface:#141F27; --surface-2:#1B2933; --line:#293944; --ink:#E2EAEE; --muted:#93A3AD;
  --accent:#4DB2CE; --accent-ink:#04222B;
  --pic:#3D9FBC; --pic-ink:#04222B; --sic:#245768; --sic-ink:#E2EAEE;
  --flight:#C6D3DA; --flight-ink:#0D151B;
  --ok:#5BBA83; --warn:#E3A84C; --crit:#EF7B6E;
  --ok-bg:#15301F; --warn-bg:#352812; --crit-bg:#3A1A17; --info-bg:#172A37;
  --conflict:#EF7B6E; --weekend:#18242C; --today-bg:#163543;
  --s1:#4DB2CE; --s2:#2F6F82; --s3:#3A4A55; --s4:#D9A04A; --s5:#B583C6; --s6:#EF7B6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151B; --surface:#141F27; --surface-2:#1B2933; --line:#293944; --ink:#E2EAEE; --muted:#93A3AD;
  --accent:#4DB2CE; --accent-ink:#04222B;
  --pic:#3D9FBC; --pic-ink:#04222B; --sic:#245768; --sic-ink:#E2EAEE;
  --flight:#C6D3DA; --flight-ink:#0D151B;
  --ok:#5BBA83; --warn:#E3A84C; --crit:#EF7B6E;
  --ok-bg:#15301F; --warn-bg:#352812; --crit-bg:#3A1A17; --info-bg:#172A37;
  --conflict:#EF7B6E; --weekend:#18242C; --today-bg:#163543;
  --s1:#4DB2CE; --s2:#2F6F82; --s3:#3A4A55; --s4:#D9A04A; --s5:#B583C6; --s6:#EF7B6E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand h1{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0;letter-spacing:.005em;text-wrap:balance}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.acstrip{display:flex;gap:8px 22px;flex-wrap:wrap;align-items:flex-end}
.acstrip div{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.acstrip small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:-1px}
.tabs button{appearance:none;border:0;background:none;padding:9px 12px 10px;font:600 13.5px var(--f-body);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.status{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.live::before{background:var(--ok)} .status.local::before{background:var(--warn)}

main .wrap{padding-block:20px 56px;display:grid;gap:28px}
.panel{display:grid;gap:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0;max-width:75ch}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit);background:var(--surface)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr[data-edit]{cursor:pointer}
.t tbody tr[data-edit]:hover td{background:var(--surface-2)}
.t .empty td{color:var(--muted);cursor:default;padding:16px 10px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.muted{color:var(--muted)}
.clip{max-width:34ch}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--info-bg);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.seat{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap}
.seat.pic{background:var(--pic);color:var(--pic-ink)} .seat.sic{background:var(--sic);color:var(--sic-ink)} .seat.oth{background:var(--line, #e5e5e5);color:inherit}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{padding:12px 14px;display:grid;gap:2px}
.stat small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat strong{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.crit strong{color:var(--crit)} .stat.warn strong{color:var(--warn)}

.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.att li:last-child{border-bottom:0}
.att li:hover{background:var(--surface-2)}
.att .what{min-width:0}
.att .what b{font-weight:600;display:block}
.att .what span{color:var(--muted);font-size:12.5px;display:block;overflow-wrap:anywhere}
.att .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.att .clear{padding:18px 12px;color:var(--muted);cursor:default}
@media (max-width:560px){.att li{grid-template-columns:minmax(0,1fr) auto}.att li .chip{grid-column:1/-1;justify-self:start;order:-1}}

/* Timeline */
.tl{--lab:150px;--dw:26px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tl-row{display:grid;grid-template-columns:var(--lab) repeat(var(--n),var(--dw));grid-template-rows:24px 8px;border-bottom:1px solid var(--line);min-width:max-content}
.tl-row:last-child{border-bottom:0}
.tl-row.head{grid-template-rows:auto;background:var(--surface)}
.tl-row.months{grid-template-rows:22px}
.tl-lab{grid-row:1/-1;grid-column:1;position:sticky;left:0;z-index:3;background:var(--surface);padding:3px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0;font-size:12.5px;line-height:1.2}
.tl-lab b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab small{color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.tl-cell{grid-row:1/-1;border-right:1px solid var(--line);opacity:1}
.tl-cell.we{background:var(--weekend)}
.tl-cell.td{background:var(--today-bg)}
.tl-cell.add{cursor:cell}
.tl-cell.add:hover{background:var(--surface-2)}
.tl-day{grid-row:1;text-align:center;font-family:var(--f-mono);font-size:11px;line-height:1.15;padding:4px 0;border-right:1px solid var(--line);color:var(--muted)}
.tl-day b{display:block;font-weight:500;color:var(--ink);font-size:11.5px}
.tl-day.we{background:var(--weekend)}
.tl-day.td{background:var(--accent);color:var(--accent-ink)} .tl-day.td b{color:var(--accent-ink)}
.tl-month{grid-row:1;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:4px 6px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.bar{grid-row:1;align-self:center;height:18px;margin:0 2px;border-radius:4px;border:0;padding:0 6px;font:600 10.5px var(--f-body);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1;background:var(--pic);color:var(--pic-ink)}
.bar.sic{background:var(--sic);color:var(--sic-ink)}
.bar.flight{background:var(--flight);color:var(--flight-ink)}
.bar.flight.ant{background:transparent;border:1.5px dashed var(--flight);color:var(--ink)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.cbar{grid-row:2;align-self:start;height:5px;margin:0 2px;border:0;padding:0;border-radius:2px;cursor:pointer;z-index:1;background:repeating-linear-gradient(135deg,var(--conflict) 0 3px,transparent 3px 6px)}
.cbar.soft{opacity:.5}
.tl-row.cov{grid-template-rows:22px}
.cov-c{grid-row:1;display:grid;place-items:center;border-right:1px solid var(--line);font:600 10px var(--f-mono)}
.cov-c.ok::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cov-c.gap{background:var(--crit-bg);color:var(--crit)}
.cov-c.gap::after{content:"!"}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.lg-pic{background:var(--pic)} .lg-sic{background:var(--sic)} .lg-fl{background:var(--flight)}
.lg-ant{border:1.5px dashed var(--flight)} .lg-con{background:repeating-linear-gradient(135deg,var(--conflict) 0 3px,transparent 3px 6px)}
.lg-gap{background:var(--crit-bg);border:1px solid var(--crit)}

/* Pilot cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.pcard{display:grid;grid-template-rows:auto 1fr auto}
.pcard-h{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.pcard-h .meta{color:var(--muted);font-size:12.5px;flex:1 1 auto;min-width:0}
.pcard-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}


/* Maintenance */
.basis{padding:12px 14px;display:grid;gap:10px}
.basis-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.lbl{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.ctrs{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ctrs b{font-family:var(--f-body);font-weight:600;font-size:12px;margin-right:4px}
.tchip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 12px var(--f-body);padding:4px 9px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tchip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tchip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.tchip .num{color:var(--muted);font-size:11.5px}
.search{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;flex:1 1 220px;min-width:0;max-width:360px}
.sub{color:var(--muted);font-size:11.5px;margin-top:1px;font-family:var(--f-body)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}
.mxt td:nth-child(2){min-width:240px}
.t td.sub.clip{min-width:260px;max-width:52ch}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:10.5px var(--f-mono)}
.chart .vl{fill:var(--ink);font:500 10.5px var(--f-mono)}
.cgrid{display:grid;grid-template-columns:110px repeat(var(--m),minmax(44px,1fr)) 150px;min-width:max-content;font-size:12px}
.cgrid>div{border-bottom:1px solid var(--line);padding:6px 6px;min-height:38px;display:flex;align-items:center}
.cgrid .ch{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-height:0;justify-content:center}
.cgrid .ch.cl,.cgrid .ch.cn{justify-content:flex-start}
.cgrid .cl{flex-direction:column;align-items:flex-start;justify-content:center;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.cgrid .cl small,.cgrid .cn small{color:var(--muted);font-size:10.5px}
.cgrid .cn{flex-direction:column;align-items:flex-start;justify-content:center;border-left:1px solid var(--line)}
.cgrid .cc{justify-content:center;gap:3px;flex-wrap:wrap}
.cgrid .yr{border-left:1px dashed var(--line)}
.dot{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 3px;border-radius:10px;background:var(--s1);color:var(--accent-ink);font:500 10.5px var(--f-mono)}
.dot.od{background:var(--crit);color:#fff}
.linkish{appearance:none;border:0;background:none;padding:0;font:600 13px var(--f-body);color:var(--accent);cursor:pointer;text-align:left}
.sumrow{display:flex;flex-wrap:wrap;gap:8px 22px}
.sumrow small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sumrow b{font-size:16px;font-weight:500}
.conf{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;background:var(--muted)}
.conf.green{background:var(--ok)} .conf.yellow{background:var(--warn)} .conf.red{background:var(--crit)}
.src{padding:10px 14px;font-size:12.5px} .src summary{cursor:pointer;font-weight:600} .src ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.src a{color:var(--accent)}
.mxd{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.mxd small{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mxd span{overflow-wrap:anywhere}
.legend i{display:inline-block}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(8,16,22,.45)}
dialog form{display:grid;gap:12px;padding:16px 18px 18px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:4px}
.field label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .help{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-f{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.err{color:var(--crit);font-size:12.5px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:50}
@media (prefers-reduced-motion:no-preference){.bar,.btn,.att li{transition:background-color .12s,filter .12s}}

/* ---------- graphical layer: tiles, gauges, nav, calendar, login ---------- */
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs .ic{width:17px;height:17px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;margin:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible}
  .tabs button{flex:1 1 0;flex-direction:column;gap:2px;padding:6px 2px 4px;font-size:10.5px;border-bottom:0;border-top:2px solid transparent;min-width:0}
  .tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
  .tabs .ic{width:22px;height:22px}
  main .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .acstrip{display:none}
  .top-row{padding-block:10px 6px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr;gap:10px}}
.tile{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:150px;position:relative;overflow:hidden;border-top:4px solid var(--line)}
.tile:hover{background:var(--surface-2)}
.tile.ok{border-top-color:var(--ok)} .tile.warn{border-top-color:var(--warn)} .tile.crit{border-top-color:var(--crit)} .tile.acc{border-top-color:var(--accent)}
.tile-h{display:flex;align-items:center;gap:8px;font:600 13px var(--f-display);letter-spacing:.01em}
.tile-h .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--accent);flex:none}
.tile.crit .tile-h .ico{background:var(--crit-bg);color:var(--crit)} .tile.warn .tile-h .ico{background:var(--warn-bg);color:var(--warn)} .tile.ok .tile-h .ico{background:var(--ok-bg);color:var(--ok)}
.tile-b{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.tile-b .big{font:500 34px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.tile.crit .big{color:var(--crit)} .tile.warn .big{color:var(--warn)}
.tile-f{font-size:12px;color:var(--muted);line-height:1.35;min-width:0;overflow-wrap:anywhere}
.tile.wide{grid-column:1/-1;min-height:0}
.tile.action{min-height:0;grid-template-rows:auto;border-top-width:1px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.action:hover{background:var(--accent);filter:brightness(1.08)}
.tile.action .tile-h .ico{background:rgba(255,255,255,.18);color:inherit}
.ring{flex:none;display:block}
.ring .trk{stroke:var(--surface-2)}
.ring .val{transition:stroke-dashoffset .5s}
.ring text{font:600 13px var(--f-mono);fill:var(--ink)}
.ring .rs{font:500 7.5px var(--f-body);fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.st-ok{stroke:var(--ok)} .st-warn{stroke:var(--warn)} .st-crit{stroke:var(--crit)} .st-none{stroke:var(--muted)} .st-acc{stroke:var(--accent)}
.pbar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.pbar.warn i{background:var(--warn)} .pbar.crit i{background:var(--crit)} .pbar.none i{background:var(--muted)}
.pbar.crit{background:var(--crit-bg)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:600 11.5px var(--f-body);background:var(--pic);color:var(--pic-ink);flex:none;letter-spacing:.02em}
.av.sic{background:var(--sic);color:var(--sic-ink)} .av.oth{background:var(--surface-2);color:var(--muted)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.avs{display:flex;flex-wrap:wrap;gap:4px}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
/* attention cards */
.att li{border-left:4px solid var(--line)}
.att li.crit{border-left-color:var(--crit)} .att li.warn{border-left-color:var(--warn)}
/* training cards */
.tcard{display:grid}
.tcard-h{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.tcard-h .who{flex:1 1 auto;min-width:0;display:grid;gap:3px}
.tcard-h .who b{font:600 15px var(--f-display)}
.tcard-h .who>span{font-size:12px;color:var(--muted)}
.ti{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.ti:last-child{border-bottom:0}
.ti:hover{background:var(--surface-2)}
.ti .nm{font-weight:600;font-size:13.5px;min-width:0}
.ti .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ti .pbar{grid-column:1/-1}
.ti .dt{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.tcard-f:empty{display:none}
.tcard-f{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.gauge{display:flex;align-items:center;gap:14px;padding:12px 14px}
.gauge div{display:grid;gap:2px;min-width:0}
.gauge small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gauge b{font:600 15px var(--f-display)}
.gauge span{font-size:12px;color:var(--muted)}
.rem{min-width:110px}
.rem .pbar{margin-top:5px}
/* month calendar */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 12.5px var(--f-body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dh{background:var(--surface);text-align:center;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.cal .dc{appearance:none;border:0;font:inherit;color:inherit;text-align:left;background:var(--surface);min-height:86px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.cal .dc:hover{background:var(--surface-2)}
.cal .dc.out{background:var(--bg);color:var(--muted)}
.cal .dc.we{background:var(--weekend)}
.cal .dc.gap{background:var(--crit-bg)}
.cal .dc .n{font:500 12px var(--f-mono);display:flex;justify-content:space-between;align-items:center}
.cal .dc.td .n b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cal .dc .n b{font-weight:600}
.cal .dc .fl{height:4px;border-radius:2px;background:var(--flight)}
.cal .dc .fl.ant{background:transparent;border-top:2px dashed var(--flight);height:0}
.cal .dc .cf{height:4px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--conflict) 0 3px,transparent 3px 6px)}
.cal .dc .avs{gap:2px}
.cal .dc .more{font:600 10px var(--f-mono);color:var(--muted);align-self:center}
.cal .dc .gp{font:700 9.5px var(--f-body);color:var(--crit);letter-spacing:.05em;text-transform:uppercase}
@media (max-width:520px){.cal .dc{min-height:64px;padding:3px}.cal .av.sm{width:17px;height:17px;font-size:8px}.cal .dh{font-size:9.5px;letter-spacing:.03em}}
.daylist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.daylist li{display:flex;align-items:center;gap:10px;font-size:13.5px}
.daylist li span{color:var(--muted);font-size:12px}
/* squawk cards */
.sqc{display:grid;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);border-left:4px solid var(--warn);cursor:pointer}
.sqc:last-child{border-bottom:0}
.sqc:hover{background:var(--surface-2)}
.sqc.ok{border-left-color:var(--ok)} .sqc.crit{border-left-color:var(--crit)} .sqc.none{border-left-color:var(--muted)}
.sqc b{font-weight:600}
.sqc .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
/* login */
.login{min-height:calc(100dvh - 120px);display:grid;place-items:center;padding:24px 0}
.login form{width:min(380px,100%);display:grid;gap:14px;padding:26px 22px;border-radius:16px}
.login .logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.login .logo .ic{width:30px;height:30px}
.login h2{font-size:22px}
.login .chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.login .btn{padding:10px 14px;font-size:15px}
body.locked .tabs,body.locked #acstrip,body.locked #pushbtn{display:none!important}
.pw{font-family:var(--f-mono);letter-spacing:.02em}
</style>

const MX_SERIES = [
  {k:"Check", l:"Letter checks", v:"--s1", types:["Check"]},
  {k:"Insp", l:"Inspections & servicing", v:"--s2", types:["Inspection/Service","Structural"]},
  {k:"Zonal", l:"Zonal", v:"--s3", types:["Zonal"]},
  {k:"EngProp", l:"Engine & propeller", v:"--s4", types:["Engine","Propeller"]},
  {k:"ADSB", l:"AD / SB", v:"--s5", types:["AD","SB/SI"]},
  {k:"Life", l:"Part life & overhaul", v:"--s6", types:["Part life/expiry"]}];
const seriesOf = t => MX_SERIES.find(s => s.types.includes(t)) || MX_SERIES[1];
const money = n => n == null ? "—" : "$" + Math.round(n).toLocaleString();
const moneyK = n => n >= 1000000 ? "$" + (n / 1000000).toFixed(2) + "M" : n >= 1000 ? "$" + Math.round(n / 1000).toLocaleString() + "k" : "$" + Math.round(n);
const ymKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const ymLabel = (k, yr) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", yr ? {month:"short", year:"2-digit"} : {month:"short"}); };
function monthsToHorizon() { const out = []; let d = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); while (d <= HORIZON) { out.push(ymKey(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); } return out; }

function stackedBars(months, data, series, opts = {}) {
  // data: {month: {seriesKey: value}}
  const W = 720, H = opts.h || 220, L = 44, R = 8, T = 10, B = 26;
  const totals = months.map(m => series.reduce((s, x) => s + ((data[m] || {})[x.k] || 0), 0));
  const max = Math.max(1, ...totals);
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const nice = [1, 2, 2.5, 5, 10].map(f => f * step).find(v => max / v <= 5) || step * 10;
  const top = Math.ceil(max / nice) * nice;
  const bw = (W - L - R) / months.length;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += nice) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${opts.fmt ? opts.fmt(v) : v}</text>`;
  months.forEach((m, i) => {
    let acc = 0; const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    for (const s of series) { const v = (data[m] || {})[s.k] || 0; if (!v) continue; g += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${Math.max(0.5, y(acc) - y(acc + v))}" style="fill:var(${s.v})"><title>${ymLabel(m, 1)} · ${s.l}: ${opts.fmt ? opts.fmt(v) : v}</title></rect>`; acc += v; }
    if (opts.labels && totals[i]) g += `<text x="${x + w / 2}" y="${y(totals[i]) - 4}" text-anchor="middle" class="vl">${opts.fmt ? opts.fmt(totals[i]) : totals[i]}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" class="ax">${ymLabel(m, m.endsWith("-01") || i === 0)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "chart")}">${g}</svg></div>`;
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const AUTH_KEY = "bta.crew.auth";
let loginErr = "", loginBusy = false;
async function sha16(text) { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(h)].slice(0, 8).map(x => x.toString(16).padStart(2, "0")).join(""); }
async function deriveKek(pw, salt, it) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64d(salt), iterations:it}, base, 256));
}
async function openWith(user, kekRaw) {
  const ent = ENC.u[await sha16("bta-user:" + user)];
  if (!ent) throw new Error("nouser");
  const kek = await crypto.subtle.importKey("raw", kekRaw, "AES-GCM", false, ["decrypt"]);
  const dek = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(ent.iv)}, kek, b64d(ent.k));
  const key = await crypto.subtle.importKey("raw", dek, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(ENC.iv)}, key, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function viewLogin() {

    <div class="field"><label for="lg-p">Password</label><input id="lg-p" name="password" type="password" autocomplete="current-password" required></div>
    <label class="chk"><input type="checkbox" id="lg-r" checked> Keep me signed in on this device</label>
    <div class="err" role="alert">${esc(loginErr)}</div>
    <button class="btn primary" type="submit"${loginBusy ? " disabled" : ""}>${loginBusy ? "Opening…" : "Sign in"}</button>

  form.innerHTML = `<div class="dlg-h"><h2>Report ${what}</h2><button type="button" class="btn sm" data-close>Close</button></div>
    <p>This page can't open other websites, so reports go through a short form. No sign-in needed.</p>
    <ol class="hint" style="margin:0 0 4px 18px;padding:0"><li>Tap <b>Copy link</b>.</li><li>Paste it into your browser's address bar and fill in the form.</li></ol>
    <div class="field"><label for="form-url">Form link</label><input id="form-url" type="text" readonly value="${esc(url)}"></div>
    ${kind === "conflictReq" ? `<p class="hint">Only Matt sees conflicts you report.</p>` : `<p class="hint">Matt reviews squawks, then they show on this board.</p>`}
    <p class="hint">Tip: the links are also in Matt's message with this board. Bookmark them for next time.</p>
    <div class="dlg-f"><div></div><div class="row"><button type="button" class="btn" data-close>Close</button><button type="button" class="btn primary" id="copy-link">Copy link</button></div></div>`;
  dlg.showModal();
  const b = form.querySelector("#copy-link"); if (b) b.focus();
}
form.addEventListener("change", () => cur && applyShow());
form.addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) { dlg.close(); return; }
  const da = e.target.closest("[data-dayadd]");
  if (da) { const d = parse(da.dataset.dayadd); dlg.close(); openForm("rotations", null, {start:iso(d), end:iso(addDays(d, 13))}); return; }
  if (e.target.closest("[data-genpw]")) { const el = form.elements.namedItem("password"); if (el) el.value = genPassword(); return; }
  const cp = e.target.closest("#copy-link");
  if (cp) {
    const inp = form.querySelector("#form-url"); const url = inp ? inp.value : "";
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (x) {}
    if (!ok && inp) { try { inp.focus(); inp.select(); ok = document.execCommand("copy"); } catch (x) {} }
    cp.textContent = ok ? "Copied" : "Press and hold the link to copy";
    if (!ok && inp) { inp.focus(); inp.select(); }
    return;
  }
  const del = e.target.closest("#f-del");
  if (del) {
    if (!cur.confirm) { cur.confirm = true; del.textContent = "Confirm delete"; $("#f-err").textContent = `Click again to delete this ${SCHEMA[cur.coll].noun}.${del.dataset.cascade || ""}`; return; }
    const {coll, id} = cur;
    try {
      if (coll === "pilots") {
        for (const c of ["training", "rotations", "conflicts"]) for (const r of S[c].filter(r => r.pilotId === id)) await remove(c, r.id);
      }
      if (cur.rep) await dropReport(coll, cur.rec.rUid, cur.rec.rItem); else await remove(coll, id);
      dlg.close(); toast(cur.rep ? "Report dismissed" : "Deleted"); queueCrewUpdate();
    } catch (err) { $("#f-err").textContent = "Couldn't delete. Check your connection and try again."; }
  }
});
form.addEventListener("submit", async e => {
  e.preventDefault();
  if (!cur) return;
  if (!OWNER && !REQ.has(cur.coll)) return;
  const sch = SCHEMA[cur.coll];
  const v = readForm();
  const visible = f => !f.show || f.show(v);
  const miss = sch.fields.filter(f => f.req && visible(f) && (v[f.k] === "" || v[f.k] === undefined));
  if (miss.length) { $("#f-err").textContent = `Fill in: ${miss.map(f => f.l).join(", ")}.`; return; }
  if (v.start && v.end && v.end < v.start) { $("#f-err").textContent = "The end date is before the start date."; return; }
  for (const f of sch.fields) if (!visible(f)) delete v[f.k];
  if (cur.coll === "crewAuth") {
    v.username = String(v.username).toLowerCase().replace(/\s+/g, "");
    if (S.crewAuth.some(u => u.id !== cur.id && String(u.username).toLowerCase() === v.username)) { $("#f-err").textContent = "Someone already has that username."; return; }
    if (String(v.password).length < 8) { $("#f-err").textContent = "Use a password of at least 8 characters."; return; }
    if (!cur.rec || cur.rec.password !== v.password || !cur.rec.salt) v.salt = randSalt();
  }
  const base = {...(cur.rec || {})}; delete base.id;
  for (const f of sch.fields) if (!visible(f)) delete base[f.k];
  const data = {...base, ...v, updated: new Date().toISOString()};
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Saving…";
  try {
    if (REQ.has(cur.coll)) { await submitReport(cur.coll, data); dlg.close(); toast(cur.coll === "conflictReq" ? "Sent to Matt" : "Squawk reported"); return; }
    if (cur.rep) {
      const clean = {...data}; for (const k of ["reported", "rUid", "rItem", "submitted"]) delete clean[k];
      if (cur.coll === "squawks" && !clean.reportedBy) { const p = pilotById(cur.rec.pilotId); if (p) clean.reportedBy = p.name; }
      clean.notes = [clean.notes, `Reported on the board${cur.rec.submitted ? " " + cur.rec.submitted : ""}.`].filter(Boolean).join(" ");
      await save(cur.coll, null, clean); await dropReport(cur.coll, cur.rec.rUid, cur.rec.rItem);
    } else await save(cur.coll, cur.id, data);
    dlg.close(); toast("Saved"); queueCrewUpdate();
  }
  catch (err) {
    btn.disabled = false; btn.textContent = "Save";
    $("#f-err").textContent = err && err.code === "no_user" ? "Sign in to claude.ai to report from the board." : err && err.code === "invalid_argument" ? "You don't have permission to do that. Ask Matt to give you Contributor access." : err && err.code === "quota_exceeded" ? "The tracker is full. Delete old entries and try again." : "Couldn't save. Check your connection and try again.";
  }
});

/* ---------- navigation ---------- */
const TABS = ["home", "schedule", "training", "maintenance", "squawks", "logins"];
function go(tab) { if (!TABS.includes(tab)) tab = "home"; ui.tab = tab; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  if (e.target.closest("dialog")) return;
  if (e.target.closest("#logoutbtn")) { signOut(); return; }
  if (e.target.closest("[data-showpw]")) { const k = e.target.closest("[data-showpw]").dataset.showpw; if (ui.showPw.has(k)) ui.showPw.delete(k); else ui.showPw.add(k); render(); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const [c, ...rest] = ed.dataset.edit.split(":"); openForm(c, rest.join(":")); return; }
  const mxr = e.target.closest("[data-mx]");
  if (mxr) { openMx(mxr.dataset.mx); return; }
  const pc = e.target.closest("[data-pace]");
  if (pc) { ui.pace = pc.dataset.pace; try { localStorage.setItem("ops.pace", ui.pace); } catch (x) {} render(); return; }
  const mw = e.target.closest("[data-mxwin]");
  if (mw) { ui.mxWin = mw.dataset.mxwin; render(); return; }
  const mt = e.target.closest("[data-mxtype]");
  if (mt) { const k = mt.dataset.mxtype; if (ui.mxOff.has(k)) ui.mxOff.delete(k); else ui.mxOff.add(k); render(); return; }
  const ad = e.target.closest("[data-add]");
  if (ad && SNAP && FORMS[ad.dataset.add]) { let w = null; try { w = window.open(FORMS[ad.dataset.add], "_blank", "noopener"); } catch (x) {} if (!w && !/github\.io$/.test(location.hostname)) openFormLink(ad.dataset.add); return; }
  if (ad) { let pf = {}; try { pf = JSON.parse(ad.dataset.prefill || "{}"); } catch (x) {} openForm(ad.dataset.add, null, pf); return; }
  const tro = e.target.closest("[data-tropen]");
  if (tro) { const k = tro.dataset.tropen; if (ui.trOpen.has(k)) ui.trOpen.delete(k); else ui.trOpen.add(k); render(); return; }
  const sc = e.target.closest("[data-sched]");
  if (sc) { ui.sched = sc.dataset.sched; try { localStorage.setItem("ops.sched", ui.sched); } catch (x) {} render(); return; }
  const cl = e.target.closest("[data-cal]");
  if (cl) { const n = Number(cl.dataset.cal); ui.calOff = n === 0 ? 0 : ui.calOff + n; render(); return; }
  const dy = e.target.closest("[data-day]");
  if (dy) { openDay(dy.dataset.day); return; }
  const tl = e.target.closest("[data-tl]");
  if (tl) { const n = Number(tl.dataset.tl); ui.tlOffset = n === 0 ? 0 : ui.tlOffset + n; render(); return; }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { ui[tg.dataset.toggle] = !ui[tg.dataset.toggle]; render(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { go(tb.dataset.tab); return; }
});
let qTimer = 0;
document.addEventListener("input", e => {
  if (e.target.id === "mx-q") { ui.mxQ = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 180); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".att li[tabindex], .ti[tabindex], .sqc[tabindex]")) { e.preventDefault(); e.target.click(); }
});
const h = (location.hash || "").slice(1);
if (TABS.includes(h)) ui.tab = h; else if (h === "overview") ui.tab = "home";

/* ---------- boot ---------- */
if (ENC && !SNAP) { bootLocked(); } else render();
(async () => {
  if (ENC && !SNAP) return;
  if (SNAP) { for (const c of [...COLLS, "squawkReports"]) S[c] = Array.isArray(SNAP[c]) ? SNAP[c] : []; mode = "snap"; OWNER = false; scheduleRender(); return; }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { mode = "local"; OWNER = true; scheduleRender(); return; }
  mode = "live";
  let user = null;
  try { user = await window.claude.use("user"); } catch (e) { user = null; }
  if (user) { try { OWNER = !!(await user.isOwner()); UID = await user.id(); } catch (e) {} }
  for (const c of COLLS) {
    if (!OWNER && OWNER_ONLY.has(c)) continue;
    db.collection(c).onSnapshot(
      snap => { S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); scheduleRender(); },
      () => { mode = "local"; scheduleRender(); }
    );
  }
  const listColl = k => db.collection(k).onSnapshot(snap => { S[k] = snap.docs.map(d => ({id:d.id, ...d.data()})); scheduleRender(); }, () => {});
  listColl("squawkReports");
  if (OWNER) listColl("conflictReports");
  else if (UID) db.collection("conflictReports").doc(UID).onSnapshot(snap => { S.conflictReports = snap.exists ? [{id:snap.id, ...snap.data()}] : []; scheduleRender(); }, () => {});
  scheduleRender();
})();
})();
</script>

</body></html>
